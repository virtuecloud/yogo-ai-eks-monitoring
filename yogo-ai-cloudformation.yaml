AWSTemplateFormatVersion: '2010-09-09'
Description: 'Monitoring: yogo-ai Push-Based Monitoring Setup. Deploys an API Gateway and API Key to securely expose your internal yogo-ai EKS services to the Monitoring Dashboard.'

Parameters:
  ClusterName:
    Type: String
    Description: Name of your existing EKS Cluster where yogo-ai will be deployed.
  YogoAiLoadBalancerArn:
    Type: String
    Description: The ARN of the internal Network Load Balancer for the yogo-ai service.
  QdrantLoadBalancerArn:
    Type: String
    Description: The ARN of the internal Network Load Balancer for the Qdrant service.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC ID where the Internal Load Balancers reside.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for the API Gateway VPC Link. Must be in the same VPC as the Load Balancers.

Resources:
  YogoAiVpcLink:
    Type: AWS::ApiGateway::VpcLink
    Properties: 
      Name: !Sub "$${ClusterName}-yogo-ai-vpc-link"
      Description: VPC Link to yogo-ai service
      TargetArns: 
        - !Ref YogoAiLoadBalancerArn

  QdrantVpcLink:
    Type: AWS::ApiGateway::VpcLink
    Properties: 
      Name: !Sub "$${ClusterName}-qdrant-vpc-link"
      Description: VPC Link to qdrant service
      TargetArns: 
        - !Ref QdrantLoadBalancerArn

  MonitoringApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "$${ClusterName}-monitoring-api"
      Description: Secure proxy for VirtueCloud monitoring
      EndpointConfiguration:
        Types: [REGIONAL]

  # --- YogoAi Proxy ---
  YogoAiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MonitoringApi
      ParentId: !GetAtt MonitoringApi.RootResourceId
      PathPart: "yogo-ai"

  YogoAiProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MonitoringApi
      ParentId: !Ref YogoAiResource
      PathPart: "{proxy+}"

  YogoAiProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MonitoringApi
      ResourceId: !Ref YogoAiProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      ApiKeyRequired: true
      RequestParameters:
        "method.request.path.proxy": true
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: ANY
        Uri: "http://internal-nlb.local:3456/{proxy}"
        ConnectionType: VPC_LINK
        ConnectionId: !Ref YogoAiVpcLink
        RequestParameters:
          "integration.request.path.proxy": "method.request.path.proxy"

  # --- Qdrant Proxy ---
  QdrantResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MonitoringApi
      ParentId: !GetAtt MonitoringApi.RootResourceId
      PathPart: "qdrant"

  QdrantProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MonitoringApi
      ParentId: !Ref QdrantResource
      PathPart: "{proxy+}"

  QdrantProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MonitoringApi
      ResourceId: !Ref QdrantProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      ApiKeyRequired: true
      RequestParameters:
        "method.request.path.proxy": true
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: ANY
        Uri: "http://internal-nlb.local:6333/{proxy}"
        ConnectionType: VPC_LINK
        ConnectionId: !Ref QdrantVpcLink
        RequestParameters:
          "integration.request.path.proxy": "method.request.path.proxy"

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: 
      - YogoAiProxyMethod
      - QdrantProxyMethod
    Properties:
      RestApiId: !Ref MonitoringApi
      Description: Initial deployment

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref MonitoringApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod

  MonitoringUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiStage
    Properties:
      UsagePlanName: !Sub "$${ClusterName}-monitoring-plan"
      Description: Usage plan for VirtueCloud monitoring
      ApiStages:
        - ApiId: !Ref MonitoringApi
          Stage: prod

  MonitoringApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: !Sub "$${ClusterName}-MonitoringApiKey"
      Description: API Key for VirtueCloud Dashboard
      Enabled: true

  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref MonitoringApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref MonitoringUsagePlan

Outputs:
  YogoAiApiUrl:
    Description: Base URL for the yogo-ai API Gateway
    Value: !Sub "https://$${MonitoringApi}.execute-api.$${AWS::Region}.amazonaws.com/prod/yogo-ai"
  QdrantUrl:
    Description: Base URL for the Qdrant API Gateway
    Value: !Sub "https://$${MonitoringApi}.execute-api.$${AWS::Region}.amazonaws.com/prod/qdrant"
  MonitoringApiKey:
    Description: "[THIS IS ONLY THE ID] AWS hides the secret value. Go to AWS Console -> API Gateway -> API Keys -> select this ID -> click 'Show' to get the actual key value to paste in the Dashboard."
    Value: !Ref MonitoringApiKey
