{{- if .Values.resourceSync.enabled }}
apiVersion: yogo-ai.devopstoolkit.live/v1alpha1
kind: ResourceSyncConfig
metadata:
  name: default-sync
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
spec:
  targetClusterId: "hub"
  mcpEndpoint: http://yogo-ai:3456/api/v1/resources/sync
  mcpAuthSecretRef:
    name: yogo-ai-secrets
    key: auth-token
  {{- with .Values.resourceSync.debounceWindowSeconds }}
  debounceWindowSeconds: {{ . }}
  {{- end }}
  {{- with .Values.resourceSync.resyncIntervalMinutes }}
  resyncIntervalMinutes: {{ . }}
  {{- end }}
{{- end }}
