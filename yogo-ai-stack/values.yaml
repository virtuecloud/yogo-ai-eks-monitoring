# yogo-ai-stack umbrella chart values

global:
  namespace: "yogo-ai"

# yogo-ai MCP server configuration (core component - always deployed)
# Override sub-chart values by nesting under the chart name

# Hub-and-Spoke: Remote cluster kubeconfig injection (optional)
# When configured, controllers and plugins will use this kubeconfig
# to operate on a remote client cluster instead of the local in-cluster config.
# The Secret must exist in the same namespace and contain a key named "config"
# with the full kubeconfig YAML for the remote cluster.
# remoteCluster:
#   secretName: "client-cluster-kubeconfig"

# yogo-ai MCP server configuration (core component - always deployed)
yogo-ai:
  kubeconfigsPVC: "kubeconfigs-pvc"
  image:
    repository: virtuecloud/yogo-ai
    tag: latest
    pullPolicy: IfNotPresent
  # Fixed service name so tunnel can find it at http://yogo-ai:3456
  fullnameOverride: yogo-ai
  # Enable local embeddings to use in-cluster HuggingFace TEI for semantic search
  # without requiring external embedding API keys (recommended for new installations)
  # localEmbeddings:
  #   enabled: true
  # Example overrides:
  secrets:
    auth:
      token: "your-auth-token"  # The yogo-ai auth token generated by the client
  ai:
    provider: "amazon_bedrock"
    model: "openai.gpt-oss-120b-1:0"

# VirtueCloud Central Configuration
virtueCloud:
  # The central tunnel server endpoint (e.g., wss://tunnel.virtuecloud.io)
  tunnelServer: "wss://tunnel.virtuecloud.io"
  # The unique token provided by VirtueCloud Dashboard to authenticate the tunnel connection
  socketToken: "REPLACE_WITH_VIRTUECLOUD_SOCKET_TOKEN"

# yogo-ai-controller configuration
yogo-ai-controller:
  kubeconfigsPVC: "kubeconfigs-pvc"
  image:
    repository: virtuecloud/yogo-ai-controller
    tag: latest
    pullPolicy: IfNotPresent
  # Set to false to disable the controller (e.g., for MCP-only usage)
  enabled: true
  fullnameOverride: yogo-ai-controller
  # Example overrides:
  # resources:
  #   limits:
  #     cpu: 1000m
  #     memory: 1Gi

# ResourceSyncConfig - enables resource discovery and semantic search
resourceSync:
  enabled: true
  # debounceWindowSeconds: 30    # Seconds to wait before syncing after a change (default: 10, max: 300)
  # resyncIntervalMinutes: 120   # Minutes between full resyncs (default: 60, max: 1440)

# CapabilityScanConfig - enables cluster capability discovery
capabilityScan:
  enabled: true
  # debounceWindowSeconds: 30    # Seconds to wait before scanning after a change (default: 10, max: 300)
