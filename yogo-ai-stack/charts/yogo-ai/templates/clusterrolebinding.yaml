{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "yogo-ai.fullname" . }}
  labels:
    {{- include "yogo-ai.labels" . | nindent 4 }}
  {{- $annotations := include "yogo-ai.annotations" (dict "global" .Values.annotations "local" nil) -}}
  {{- if $annotations }}
  annotations:
    {{- $annotations | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "yogo-ai.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "yogo-ai.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}