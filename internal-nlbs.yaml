apiVersion: v1
kind: Service
metadata:
  name: dot-ai-nlb
  namespace: dot-ai
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: dot-ai
  ports:
    - port: 3456
      targetPort: 3456
      protocol: TCP
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: dot-ai-qdrant-nlb
  namespace: dot-ai
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - port: 6333
      targetPort: 6333
      protocol: TCP
      name: http
